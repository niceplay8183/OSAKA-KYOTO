    <!-- Custom Styles and Fonts -->

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes fade-in {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        .animate-fade-in {
          animation: fade-in 0.3s ease-out;
        }
        @keyframes slide-up {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
          animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

                location: "Torokko Kameoka Station",
                notes: "搭乘復古小火車回到嵐山，欣賞保津川峽谷。",

              },

              {

                title: "HARUKA -> 天王寺",
                location: "Kyoto Station",
                notes: "搭乘 HARUKA 前往大阪天王寺站。早餐若未定可在車站買便當。",
                tags: ["移動日"],
                reservation: null
              },
              {

                notes: "先到飯店寄放行李。這是一間宿坊風格的飯店，很有特色。",

                notes: "搭乘 JR 阪和線至「鳳站」。參拜並購買御守 (以強運、交通安全聞名)。",

                reservation: null
              }
            ]
          }
        ];

        // --- 元件 (Components) ---

        const Sun = () => <span role="img" aria-label="sun">☀️</span>;
        const CloudRain = () => <span role="img" aria-label="rain">🌧️</span>;
        const Cloud = () => <span role="img" aria-label="cloud">☁️</span>;
        const Utensils = () => <span role="img" aria-label="utensils">🍴</span>;
        const Train = () => <span role="img" aria-label="train">🚄</span>;
        const Camera = () => <span role="img" aria-label="camera">📷</span>;
        const MapPin = () => <span role="img" aria-label="map-pin">📍</span>;
        const Plane = () => <span role="img" aria-label="plane">✈️</span>;
        const Bed = () => <span role="img" aria-label="bed">🛏️</span>;
        const Info = () => <span role="img" aria-label="info">ℹ️</span>;
        const CreditCard = () => <span role="img" aria-label="credit-card">💳</span>;
        const Navigation = () => <span role="img" aria-label="navigation">🧭</span>;
        const ChevronRight = () => <span className="font-bold text-xl leading-none">&rarr;</span>; 
        const ShoppingBag = () => <span role="img" aria-label="shopping">🛍️</span>;
        const Wine = () => <span role="img" aria-label="wine">🍷</span>;


        const WeatherIcon = ({ type }) => {
          const size = "text-xl";
          switch (type) {
            case 'sunny': return <Sun className={`w-5 h-5 text-orange-400 ${size}`} />;
            case 'rain': return <CloudRain className={`w-5 h-5 text-blue-400 ${size}`} />;
            case 'cloudy': return <Cloud className={`w-5 h-5 text-gray-400 ${size}`} />;
            default: return <Sun className={`w-5 h-5 text-orange-400 ${size}`} />;
          }
        };

        const TypeIcon = ({ type }) => {
          const baseClass = "p-2 rounded-full mb-3 ";
          const iconSize = "text-xl"; 
          let icon;
          switch (type) {
            case 'food': icon = <Utensils className={iconSize} />; break;
            case 'transport': icon = <Train className={iconSize} />; break;
            case 'spot': icon = <Camera className={iconSize} />; break;
            case 'shopping': icon = <ShoppingBag className={iconSize} />; break;
            default: icon = <MapPin className={iconSize} />; break;
          }
          let bgColor;
          switch (type) {
            case 'food': bgColor = "bg-orange-100 text-orange-600"; break;
            case 'transport': bgColor = "bg-blue-100 text-blue-600"; break;
            case 'spot': bgColor = "bg-emerald-100 text-emerald-600"; break;
            case 'shopping': bgColor = "bg-pink-100 text-pink-600"; break;
            default: bgColor = "bg-gray-100 text-gray-600"; break;
          }
          
          return (
            <div className={`${baseClass} ${bgColor} flex items-center justify-center`}>
                {icon}
            </div>
          );
        };

        const Tag = ({ text }) => {
          let style = "bg-stone-200 text-stone-600";
          if (text.includes("必吃") || text.includes("必買") || text.includes("重要") || text.includes("燒肉")) style = "bg-red-50 text-red-600 border border-red-100 font-medium";
          if (text.includes("預約") || text.includes("車程") || text.includes("座位") || text.includes("移動")) style = "bg-indigo-50 text-indigo-600 border border-indigo-100 font-medium";
          
          return (
            <span className={`text-xs px-2 py-1 rounded-md mr-2 mb-2 inline-block ${style}`}>
              {text}
            </span>
          );
        };

        const ItineraryCard = ({ item }) => {
          let query = item.title + " " + item.location;
          if (item.title.includes("馬堀")) {
            query = "Umahori Station to Torokko Kameoka Station";
          }
          // Day 3 大鳥大社導航優化
          if (item.title.includes("大鳥大社")) {
            query = "Otori Taisha";
          }

          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;

          return (
            <div className="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-stone-100 relative overflow-hidden transition-all active:scale-[0.99]">
              <div className="flex justify-between items-start mb-2">
                <div className="flex flex-col">
                  <span className="text-xs font-bold text-stone-400 tracking-widest mb-1 font-mono">{item.time}</span>
                  <h3 className="text-lg font-bold text-stone-800 leading-tight">{item.title}</h3>
                </div>
                <TypeIcon type={item.type} />
              </div>

              <div className="flex items-center text-stone-500 text-sm mb-3 bg-stone-50 p-2 rounded-lg">
                <MapPin />
                <span className="truncate ml-1">{item.location}</span>
              </div>

              {/* Tags & Highlights */}
              <div className="flex flex-wrap mb-3">
                {item.reservation && (
                  <div className="w-full mb-2 bg-yellow-50 border border-yellow-200 text-yellow-800 text-xs px-3 py-2 rounded-lg flex items-center">
                    <CreditCard />
                    <span className="ml-1">預約/代號：</span><span className="font-mono font-bold ml-1 text-sm">{item.reservation}</span>
                  </div>
                )}
                {item.tags.map((tag, idx) => <Tag key={idx} text={tag} />)}
              </div>

              <p className="text-stone-600 text-sm leading-relaxed mb-4 border-l-2 border-stone-200 pl-3 whitespace-pre-line">
                {item.notes}
              </p>

              {/* Action Button */}
              <a 
                href={mapsUrl} 
                target="_blank" 
                rel="noopener noreferrer"
                className="flex items-center justify-center w-full bg-stone-800 text-white py-3 rounded-xl font-medium text-sm hover:bg-stone-700 transition-colors"
              >
                <Navigation />
                <span className="ml-2">
                  {item.title.includes("馬堀") ? "步行導航" : "開啟導航"}
                </span>
              </a>
            </div>
          );
        };

        const DaySelector = ({ days, activeDay, setActiveDay }) => {
          return (
            <div className="flex space-x-3 overflow-x-auto pb-4 pt-2 px-1 scrollbar-hide">
              {days.map((d) => (
                <button
                  key={d.day}
                  onClick={() => setActiveDay(d.day)}
                  className={`flex-shrink-0 px-5 py-3 rounded-2xl flex flex-col items-center min-w-[80px] transition-all border ${
                    activeDay === d.day
                      ? "bg-stone-800 text-white border-stone-800 shadow-md transform scale-105"
                      : "bg-white text-stone-500 border-stone-200"
                  }`}
                >
                  <span className="text-xs font-mono opacity-80 mb-1">Day {d.day}</span>
                  <span className="font-bold text-sm whitespace-nowrap">{d.date.split(" ")[0]}</span>
                </button>
              ))}
            </div>
          );
        };

        const EssentialsView = ({ data }) => {
          return (
            <div className="space-y-6 pb-24 animate-fade-in">
              {/* Flights */}
              <section>
                <h2 className="text-xl font-bold text-stone-800 mb-4 flex items-center">
                  <Plane /><span className="ml-2">航班資訊</span>
                </h2>
                {[data.flight.outbound, data.flight.inbound].map((flight, idx) => (
                  <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-stone-100 mb-3">
                    <div className="flex justify-between items-center mb-4">
                      <span className="bg-stone-100 text-stone-600 px-2 py-1 rounded text-xs font-bold">{idx === 0 ? '去程' : '回程'}</span>
                      <span className="text-lg font-mono font-bold text-stone-800">{flight.code}</span>
                    </div>
                    <div className="flex justify-between items-center text-center">
                      <div>
                        <div className="text-2xl font-bold text-stone-800">{flight.from}</div>
                        <div className="text-xs text-stone-400 mt-1">{flight.time}</div>
                      </div>
                      <div className="flex-1 px-4 flex flex-col items-center">
                        <div className="h-[1px] w-full bg-stone-300 relative top-2"></div>
                        <Plane className="text-stone-300 relative bg-white px-1 text-xs" />
                        <div className="text-xs text-stone-400 mt-2">{flight.date}</div>
                      </div>
                      <div>
                        <div className="text-2xl font-bold text-stone-800">{flight.to}</div>
                        <div className="text-xs text-stone-400 mt-1">{flight.terminal}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </section>

              {/* Hotels */}
              <section>
                <h2 className="text-xl font-bold text-stone-800 mb-4 flex items-center">
                  <Bed /><span className="ml-2">住宿資訊</span>
                </h2>
                {data.accommodation.map((hotel, idx) => (
                  <div key={idx} className="bg-white p-5 rounded-2xl shadow-sm border border-stone-100 mb-3">
                    <h3 className="font-bold text-lg text-stone-800 mb-1">{hotel.name}</h3>
                    <p className="text-sm text-stone-500 mb-3 flex items-start">
                      <MapPin /> <span className="ml-1 mt-0.5 shrink-0">{hotel.address}</span>
                    </p>
                    <div className="bg-stone-50 rounded-xl p-3 flex justify-between items-center">
                      <div>
                        <div className="text-xs text-stone-400">CHECK-IN</div>
                        <div className="font-bold text-stone-700">{hotel.checkIn}</div>
                      </div>
                      <ChevronRight />
                      <div>
                        <div className="text-xs text-stone-400">CHECK-OUT</div>
                        <div className="font-bold text-stone-700">{hotel.checkOut}</div>
                      </div>
                    </div>
                    <div className="mt-3 flex items-center justify-between pt-3 border-t border-stone-100">
                       <span className="text-xs text-stone-400">Booking ID</span>
                       <span className="font-mono font-bold text-stone-800">{hotel.bookingId}</span>
                    </div>
                     <a 
                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(hotel.name)}`}
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="mt-4 flex items-center justify-center w-full bg-white border border-stone-300 text-stone-600 py-2 rounded-lg text-sm font-medium hover:bg-stone-50 transition-colors"
                    >
                      開啟導航
                    </a>
                  </div>
                ))}
              </section>
            </div>
          );
        };

        function App() {
          const [activeTab, setActiveTab] = useState('itinerary'); 
          const [activeDay, setActiveDay] = useState(1);

          const currentDayData = itineraryData.find(d => d.day === activeDay);

          return (
            <div className="min-h-screen bg-[#FDFCF8] text-stone-800 font-sans selection:bg-stone-200">
              
              {/* Header */}
              <header className="sticky top-0 z-50 bg-[#FDFCF8]/90 backdrop-blur-md px-6 pt-12 pb-2 border-b border-stone-100">
                <div className="flex justify-between items-center mb-1">
                  <h1 className="text-2xl font-black tracking-tight text-stone-800">
                    {activeTab === 'itinerary' ? '京阪之旅' : '行程確認單'}
                  </h1>
                  {activeTab === 'itinerary' && (
                     <div className="flex items-center space-x-1 bg-white border border-stone-200 px-3 py-1 rounded-full shadow-sm">
                        <WeatherIcon type={currentDayData.weather.type} />
                        <span className="text-xs font-medium text-stone-600">{currentDayData.weather.temp}</span>
                     </div>
                  )}
                </div>
                <p className="text-stone-400 text-sm font-medium">
                  {activeTab === 'itinerary' 
                    ? `${currentDayData.location} • ${currentDayData.weather.desc}` 
                    : '住宿與航班'}
                </p>
              </header>

              {/* Main Content Area */}
              <main className="px-5 pt-4 pb-28 max-w-md mx-auto">
                
                {activeTab === 'itinerary' && (
                  <>
                    <DaySelector 
                      days={itineraryData} 
                      activeDay={activeDay} 
                      setActiveDay={setActiveDay} 
                    />
                    
                    <div className="mt-2 space-y-1 animate-slide-up">
                      {currentDayData.items.map((item) => (
                        <ItineraryCard key={item.id} item={item} />
                      ))}
                      
                      {/* End of day marker */}
                      <div className="flex items-center justify-center py-8 opacity-50">
                        <div className="h-px bg-stone-300 w-12 mr-2"></div>
                        <span className="text-xs font-mono text-stone-400">DAY {activeDay} END</span>
                        <div className="h-px bg-stone-300 w-12 ml-2"></div>
                      </div>
                    </div>
                  </>
                )}

                {activeTab === 'essentials' && (
                  <EssentialsView data={tripEssentials} />
                )}

              </main>

              {/* Bottom Navigation */}
              <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-200 pb-safe pt-2 px-6 shadow-[0_-5px_20px_rgba(0,0,0,0.03)] z-50">
                <div className="flex justify-around items-center max-w-md mx-auto h-16">
                  <button 
                    onClick={() => setActiveTab('itinerary')}
                    className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'itinerary' ? 'text-stone-800' : 'text-stone-400'}`}
                  >
                    <MapPin />
                    <span className="text-[10px] font-bold tracking-wide">行程</span>
                  </button>
                  
                  <button 
                    onClick={() => setActiveTab('essentials')}
                    className={`flex flex-col items-center justify-center w-full h-full space-y-1 ${activeTab === 'essentials' ? 'text-stone-800' : 'text-stone-400'}`}
                  >
                    <Info />
                    <span className="text-[10px] font-bold tracking-wide">資訊</span>
                  </button>
                </div>
              </nav>
            </div>
          );
        }

        // Render the App
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
